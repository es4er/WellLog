# DeepSeek 大模型配置
deepseek:
  enabled: true
  api-key: ${DEEPSEEK_API_KEY:}
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat
  temperature: 0.2
  max-tokens: 2048

# Agent 编排与 AI 分析
agent:
  enabled: true
  default-model-provider: deepseek
  trace-enabled: true
  manual-review-enabled: true
  auto-analysis-enabled: true

# 数据库的驱动
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wms_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      # Redis服务器地址
      host: localhost
      # Redis端口（默认6379）
      port: 6379
      # Redis密码（无密码则注释/留空）
      # 连接超时时间（毫秒）
      timeout: 10000ms
      # 数据库索引（Redis默认16个库，默认使用0库）
      database: 0
      # 连接池配置（提升性能）
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数
          min-idle: 3
          # 最大等待时间（毫秒，-1表示无限制）
          max-wait: -1ms
  servlet:
    multipart:
      max-file-size: 10MB        # 单个文件最大10MB
      max-request-size: 20MB     # 单次请求最大50MB
  # 文件上传核心配置
file:
  upload:
    root-path: C:/upload/file/   # 企业级存储路径（非项目根目录，避免部署丢失）
    temp-root-path: C:/upload/temp/
    allow-types: jpg,png,jpeg,gif,pdf # 仅允许图片类型（头像）
    # 双层随机路径长度
    first-level-length: 2
    second-level-length: 3
    max-size: 10485760 # 10MB

mybatis-plus:
  mapper-locations: classpath*:mappers/*.xml
  type-aliases-package: com.upc.wms.entity
  configuration:
    # 需要排查 SQL 时再打开：log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deletedFlag
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.upc.wms.mapper: warn
    org.apache.ibatis: warn
    org.mybatis: warn
    java.sql: warn
server:
  port: 8088

# OpenCV + SSIM 轻量视觉对比服务（Python FastAPI）
inspection:
  service:
    base-url: http://localhost:8002