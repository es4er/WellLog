<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="pagebg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe8e2"/><stop offset="1" stop-color="#cdd9d1"/>
    </linearGradient>
    <linearGradient id="sb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26362f"/><stop offset="1" stop-color="#1b2823"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1f2f3a" flood-opacity="0.22"/>
    </filter>
    <clipPath id="win"><rect x="40" y="40" width="1120" height="680" rx="18"/></clipPath>
  </defs>
  <rect width="1200" height="760" fill="url(#pagebg)"/>
  <rect x="40" y="40" width="1120" height="680" rx="18" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#win)">
    <rect x="40" y="40" width="1120" height="52" fill="#f6f8f7"/>
    <circle cx="66" cy="66" r="6" fill="#e07b6a" opacity="1"/><circle cx="86" cy="66" r="6" fill="#e6c15a" opacity="1"/><circle cx="106" cy="66" r="6" fill="#7fc08a" opacity="1"/>
    <text x="600" y="71" font-size="13" fill="#8a9891" font-weight="400" text-anchor="middle" opacity="1">WellLog WMS · AI 助手</text>
    <rect x="40" y="92" width="210" height="628" rx="0" fill="url(#sb)" stroke="none" stroke-width="1" opacity="1"/>
    <text x="66" y="118" font-size="15" fill="#ffffff" font-weight="700" text-anchor="start" opacity="1">WellLog WMS</text>
    <rect x="52" y="102" width="186" height="36" rx="9" fill="#ffffff" stroke="none" stroke-width="1" opacity="0.1"/><rect x="52" y="106" width="3" height="28" rx="2" fill="#8fd0a8" stroke="none" stroke-width="1" opacity="1"/><circle cx="72" cy="120" r="5" fill="#8fd0a8" opacity="1"/><text x="88" y="124" font-size="14" fill="#ffffff" font-weight="600" text-anchor="start" opacity="1">工作台</text><circle cx="72" cy="164" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="168" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">智能体工会</text><circle cx="72" cy="208" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="212" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">订单计划</text><circle cx="72" cy="252" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="256" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">出库协同</text><circle cx="72" cy="296" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="300" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">收货上架</text><circle cx="72" cy="340" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="344" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">拣货任务</text><circle cx="72" cy="384" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="388" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">库存控制</text><circle cx="72" cy="428" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="432" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">库存盘点</text><circle cx="72" cy="472" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="476" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">数据分析</text><circle cx="72" cy="516" r="5" fill="#ffffff" opacity="0.35"/><text x="88" y="520" font-size="14" fill="#ffffff" font-weight="400" text-anchor="start" opacity="0.62">系统管理</text>
    <text x="280" y="136" font-size="24" fill="#2c3b34" font-weight="700" text-anchor="start" opacity="1">AI 助手 · 意图分流</text><text x="280" y="162" font-size="13" fill="#8a9891" font-weight="400" text-anchor="start" opacity="1">先判意图再分流：问答直接回答，动作需人工确认后才编排 Agent</text><rect x="280" y="188" width="82" height="30" rx="15" fill="#fff" stroke="#e2e8e4" stroke-width="1" opacity="1"/><text x="321" y="208" font-size="12.5" fill="#8a9891" font-weight="400" text-anchor="middle" opacity="1">问答</text><rect x="372" y="188" width="82" height="30" rx="15" fill="#587766" stroke="none" stroke-width="1" opacity="1"/><text x="413" y="208" font-size="12.5" fill="#fff" font-weight="600" text-anchor="middle" opacity="1">待执行</text><rect x="464" y="188" width="82" height="30" rx="15" fill="#fff" stroke="#e2e8e4" stroke-width="1" opacity="1"/><text x="505" y="208" font-size="12.5" fill="#8a9891" font-weight="400" text-anchor="middle" opacity="1">需补充</text><rect x="556" y="188" width="82" height="30" rx="15" fill="#fff" stroke="#e2e8e4" stroke-width="1" opacity="1"/><text x="597" y="208" font-size="12.5" fill="#8a9891" font-weight="400" text-anchor="middle" opacity="1">无权限</text><rect x="700" y="246" width="400" height="62" rx="14" fill="#587766" stroke="none" stroke-width="1" opacity="1"/><text x="720" y="276" font-size="13" fill="#fff" font-weight="400" text-anchor="start" opacity="1">把 SO-20260712 拆成领料单，</text><text x="720" y="296" font-size="13" fill="#fff" font-weight="400" text-anchor="start" opacity="1">并把缺料项标出来</text><circle cx="660" cy="277" r="16" fill="#587766" opacity="0.15"/><text x="660" y="283" font-size="12" fill="#587766" font-weight="700" text-anchor="middle" opacity="1">李</text><rect x="280" y="336" width="560" height="230" rx="14" fill="#fff" stroke="#e2e8e4" stroke-width="1" opacity="1"/><circle cx="314" cy="372" r="16" fill="#587766" opacity="0.15"/><text x="314" y="378" font-size="11" fill="#587766" font-weight="700" text-anchor="middle" opacity="1">AI</text><text x="342" y="377" font-size="13" fill="#2c3b34" font-weight="400" text-anchor="start" opacity="1">已识别为「待执行」动作，任务类型：ORDER_PLAN_REQUISITION</text><text x="342" y="406" font-size="13" fill="#8a9891" font-weight="400" text-anchor="start" opacity="1">预计执行链：</text><text x="342" y="432" font-size="13" fill="#2c3b34" font-weight="600" text-anchor="start" opacity="1">OrderPlanAgent → InventoryAgent（齐套校验）</text><text x="342" y="456" font-size="13" fill="#2c3b34" font-weight="600" text-anchor="start" opacity="1">→ OrderPlanAgent（生成领料单）→ AuditAgent</text><rect x="304" y="478" width="290" height="68" rx="10" fill="#f5f9f6" stroke="#e2e8e4" stroke-width="1" opacity="1"/><text x="320" y="506" font-size="13" fill="#2c3b34" font-weight="600" text-anchor="start" opacity="1">确认启动 Agent 流水线？</text><text x="320" y="528" font-size="11.5" fill="#8a9891" font-weight="400" text-anchor="start" opacity="1">写库由领域 Agent 基于真实数据完成</text><rect x="610" y="502" width="96" height="36" rx="9" fill="#587766" stroke="none" stroke-width="1" opacity="1"/><text x="658" y="525" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" opacity="1">确认执行</text><rect x="716" y="502" width="96" height="36" rx="9" fill="#fff" stroke="#e2e8e4" stroke-width="1" opacity="1"/><text x="764" y="525" font-size="13" fill="#8a9891" font-weight="400" text-anchor="middle" opacity="1">取消</text>
  </g>
</svg>